name: CI

on:
  push:
    branches: [main, m0-foundation]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[dev]'
      - run: mypy

  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[dev]'
      - run: pytest

  detection-accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reserve the detection accuracy gate for M2
        run: echo 'Detection accuracy corpus ships in M2.'

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: dashboard
      - run: npm run typecheck && npm run build
        working-directory: dashboard
