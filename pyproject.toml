[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frostglass"
version = "0.0.1"
description = "Self-hosted AI gateway and DLP proxy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.13,<1.14",
  "pytest>=8.3,<8.4",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=frostglass --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["frostglass"]

[tool.coverage.run]
branch = true
source = ["frostglass"]
